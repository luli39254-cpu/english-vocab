<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>📚 英语背单词</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
        .header { background: linear-gradient(135deg, #2c3e50, #3498db); color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .tab-bar { display: flex; background: white; position: sticky; top: 52px; z-index: 99; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab { flex: 1; padding: 14px 5px; text-align: center; cursor: pointer; font-size: 13px; border: none; background: white; color: #7f8c8d; transition: all 0.3s; }
        .tab.active { color: #3498db; border-bottom: 3px solid #3498db; font-weight: bold; }
        .container { max-width: 500px; margin: 0 auto; padding: 15px; padding-bottom: 80px; }
        .card { background: white; border-radius: 16px; padding: 25px 20px; margin: 12px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center; }
        .word-display { font-size: 38px; font-weight: bold; color: #2c3e50; margin: 10px 0; word-break: break-all; }
        .meaning-display { font-size: 20px; color: #27ae60; margin: 8px 0; }
        .example-display { font-size: 14px; color: #7f8c8d; font-style: italic; margin: 8px 0; line-height: 1.5; }
        .btn { padding: 12px 18px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; margin: 4px; color: white; transition: all 0.2s; display: inline-block; }
        .btn:active { transform: scale(0.95); opacity: 0.9; }
        .btn-blue { background: #3498db; }
        .btn-green { background: #2ecc71; }
        .btn-orange { background: #f39c12; }
        .btn-red { background: #e74c3c; }
        .btn-gray { background: #95a5a6; }
        .btn-purple { background: #9b59b6; }
        .btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 15px; }
        .btn-row .btn { flex: 1; min-width: 60px; text-align: center; }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 8px 0; border: 2px solid #e0e0e0; border-radius: 12px; background: white; font-size: 16px; cursor: pointer; text-align: left; transition: all 0.2s; }
        .option-btn:active { background: #f0f0f0; }
        .option-btn.correct { background: #2ecc71; color: white; border-color: #2ecc71; }
        .option-btn.wrong { background: #e74c3c; color: white; border-color: #e74c3c; }
        .option-btn:disabled { pointer-events: none; opacity: 0.8; }
        .progress-text { font-size: 12px; color: #95a5a6; text-align: center; margin: 8px 0; }
        .badge { display: inline-block; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .badge-star { background: #fff3cd; color: #f39c12; }
        .list-item { padding: 15px 12px; border-bottom: 1px solid #f0f0f0; font-size: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .list-item:active { background: #f8f9fa; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: #f8f9fa; padding: 18px; border-radius: 12px; text-align: center; }
        .stat-num { font-size: 30px; font-weight: bold; }
        .chart-container { text-align: center; margin: 15px 0; }
        canvas { max-width: 100%; }
        .result-big { font-size: 50px; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="header">📚 英语背单词</div>

    <div class="tab-bar">
        <button class="tab active" onclick="switchTab('study', this)">📖 学习</button>
        <button class="tab" onclick="switchTab('collect', this)">⭐ 收藏</button>
        <button class="tab" onclick="switchTab('test', this)">✍️ 测试</button>
        <button class="tab" onclick="switchTab('review', this)">🔄 复习</button>
        <button class="tab" onclick="switchTab('stats', this)">📊 统计</button>
    </div>

    <div class="container">
        <!-- 学习面板 -->
        <div id="study-panel">
            <div class="card">
                <div id="collect-badge" style="margin-bottom:5px;"></div>
                <div class="word-display" id="study-word">--</div>
                <div class="meaning-display" id="study-meaning"></div>
                <div class="example-display" id="study-example"></div>
                <div class="progress-text" id="study-progress"></div>
                <div class="btn-row">
                    <button class="btn btn-blue" onclick="prevWord()">⬅</button>
                    <button class="btn btn-orange" id="collect-btn" onclick="toggleCollect()">⭐</button>
                    <button class="btn btn-green" onclick="markLearned()">✔</button>
                    <button class="btn btn-blue" onclick="nextWord()">➡</button>
                </div>
            </div>
        </div>

        <!-- 收藏面板 -->
        <div id="collect-panel" class="hidden">
            <div class="card">
                <h3 style="text-align:center;margin-bottom:15px;">⭐ 收藏单词</h3>
                <div id="collection-list"></div>
                <div style="text-align:center;margin-top:15px;">
                    <button class="btn btn-purple" onclick="reviewCollections()">复习收藏</button>
                    <button class="btn btn-red" onclick="clearCollections()">清空</button>
                </div>
            </div>
        </div>

        <!-- 测试面板 -->
        <div id="test-panel" class="hidden">
            <div class="card">
                <h3 style="text-align:center;margin-bottom:15px;">✍️ 单词测试</h3>
                <div id="test-content" style="text-align:center;">
                    <button class="btn btn-blue" onclick="startTest()" style="font-size:16px;padding:15px 40px;">开始测试</button>
                </div>
            </div>
        </div>

        <!-- 复习面板 -->
        <div id="review-panel" class="hidden">
            <div class="card">
                <h3 style="text-align:center;margin-bottom:15px;">🔄 复习错词</h3>
                <div id="review-content" style="text-align:center;">
                    <button class="btn btn-blue" onclick="startReview()" style="font-size:16px;padding:15px 40px;">开始复习</button>
                </div>
            </div>
        </div>

        <!-- 统计面板 -->
        <div id="stats-panel" class="hidden">
            <div class="card">
                <h3 style="text-align:center;margin-bottom:15px;">📊 学习统计</h3>
                <div class="stats-grid" id="stats-grid"></div>
                <div class="chart-container">
                    <canvas id="pie-chart" width="280" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 内嵌单词库（不再依赖外部文件） ====================
        const EMBEDDED_VOCABULARY = [
            {"word": "abandon", "meaning": "放弃", "example": "He abandoned his plan."},
            {"word": "ability", "meaning": "能力", "example": "She has great ability."},
            {"word": "absence", "meaning": "缺席", "example": "His absence was noted."},
            {"word": "absolute", "meaning": "绝对的", "example": "That's absolute nonsense."},
            {"word": "absorb", "meaning": "吸收", "example": "Plants absorb water."},
            {"word": "abstract", "meaning": "抽象的", "example": "Abstract art is hard."},
            {"word": "abundant", "meaning": "丰富的", "example": "Abundant resources."},
            {"word": "academic", "meaning": "学术的", "example": "Academic background."},
            {"word": "accelerate", "meaning": "加速", "example": "The car accelerated."},
            {"word": "access", "meaning": "进入/访问", "example": "Access the internet."},
            {"word": "accompany", "meaning": "陪伴", "example": "I'll accompany you."},
            {"word": "accomplish", "meaning": "完成", "example": "We accomplished our task."},
            {"word": "accumulate", "meaning": "积累", "example": "Dust accumulated."},
            {"word": "accurate", "meaning": "准确的", "example": "Accurate measurement."},
            {"word": "accuse", "meaning": "指控", "example": "He accused her of lying."},
            {"word": "achieve", "meaning": "实现", "example": "She achieved her goal."},
            {"word": "acknowledge", "meaning": "承认", "example": "He acknowledged his mistake."},
            {"word": "acquire", "meaning": "获得", "example": "Acquire new skills."},
            {"word": "adapt", "meaning": "适应", "example": "Adapt to changes."},
            {"word": "adequate", "meaning": "足够的", "example": "Adequate food for the trip."},
            {"word": "adjust", "meaning": "调整", "example": "Adjust the mirror."},
            {"word": "administration", "meaning": "管理", "example": "The administration building."},
            {"word": "admire", "meaning": "钦佩", "example": "I admire her courage."},
            {"word": "admit", "meaning": "承认", "example": "He admitted his error."},
            {"word": "adopt", "meaning": "收养/采纳", "example": "Adopt a child."},
            {"word": "advance", "meaning": "前进", "example": "Technology advances."},
            {"word": "advantage", "meaning": "优势", "example": "Take advantage of."},
            {"word": "adventure", "meaning": "冒险", "example": "An exciting adventure."},
            {"word": "advertise", "meaning": "做广告", "example": "Advertise on TV."},
            {"word": "advice", "meaning": "建议", "example": "Give me some advice."},
            {"word": "affair", "meaning": "事务/事件", "example": "A complicated affair."},
            {"word": "affect", "meaning": "影响", "example": "Weather affects mood."},
            {"word": "afford", "meaning": "负担得起", "example": "I can't afford a car."},
            {"word": "agenda", "meaning": "议程", "example": "What's on the agenda?"},
            {"word": "aggressive", "meaning": "侵略的/好斗的", "example": "Aggressive behavior."},
            {"word": "agreement", "meaning": "协议", "example": "Reach an agreement."},
            {"word": "agriculture", "meaning": "农业", "example": "Agriculture is important."},
            {"word": "aid", "meaning": "帮助", "example": "Provide aid."},
            {"word": "aim", "meaning": "目标", "example": "His aim is to win."}
            // 你可以把原来 vocabulary.json 中的所有单词复制到这里
        ];

        // ==================== 全局数据 ====================
        let vocabulary = [];
        let progress = {
            studied_words: [],
            correct_count: 0,
            wrong_count: 0,
            test_history: [],
            wrong_words: [],
            collections: {}
        };

        let currentIndex = 0;
        let testQuestions = [];
        let testIndex = 0;
        let testScore = 0;
        let testWrongWords = [];
        let reviewQuestions = [];
        let reviewIndex = 0;
        let reviewScore = 0;

        // ==================== 数据加载/保存 ====================
        function loadVocabulary() {
            // 直接使用内嵌单词库，打乱顺序
            vocabulary = [...EMBEDDED_VOCABULARY];
            for (let i = vocabulary.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [vocabulary[i], vocabulary[j]] = [vocabulary[j], vocabulary[i]];
            }
            loadStudyWord(0);

            // 从 localStorage 加载进度
            const saved = localStorage.getItem('vocab_progress');
            if (saved) {
                try { progress = JSON.parse(saved); } catch(e) {}
            }
        }

        function saveProgress() {
            localStorage.setItem('vocab_progress', JSON.stringify(progress));
        }

        // ==================== 标签切换 ====================
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');

            ['study', 'collect', 'test', 'review', 'stats'].forEach(id => {
                document.getElementById(id + '-panel').classList.add('hidden');
            });
            document.getElementById(tab + '-panel').classList.remove('hidden');

            if (tab === 'collect') renderCollections();
            if (tab === 'stats') renderStats();
        }

        // ==================== 学习模式 ====================
        function loadStudyWord(index) {
            if (vocabulary.length === 0) return;
            currentIndex = ((index % vocabulary.length) + vocabulary.length) % vocabulary.length;
            const word = vocabulary[currentIndex];

            document.getElementById('study-word').textContent = word.word;
            document.getElementById('study-meaning').textContent = word.meaning;
            document.getElementById('study-example').textContent = '📝 ' + (word.example || '暂无例句');
            document.getElementById('study-progress').textContent =
                `${currentIndex + 1} / ${vocabulary.length}`;

            const isCollected = progress.collections && progress.collections[word.word];
            document.getElementById('collect-badge').innerHTML = isCollected ?
                '<span class="badge badge-star">⭐ 已收藏</span>' : '';
            document.getElementById('collect-btn').textContent = isCollected ? '★' : '☆';
        }

        function nextWord() { loadStudyWord(currentIndex + 1); }
        function prevWord() { loadStudyWord(currentIndex - 1); }

        function toggleCollect() {
            if (vocabulary.length === 0) return;
            const word = vocabulary[currentIndex];
            if (!progress.collections) progress.collections = {};

            if (progress.collections[word.word]) {
                delete progress.collections[word.word];
            } else {
                progress.collections[word.word] = {
                    word: word.word,
                    meaning: word.meaning,
                    example: word.example || '',
                    date: new Date().toISOString().slice(0, 10)
                };
            }
            saveProgress();
            loadStudyWord(currentIndex);
        }

        function markLearned() {
            if (vocabulary.length === 0) return;
            const word = vocabulary[currentIndex].word;
            if (!progress.studied_words.includes(word)) {
                progress.studied_words.push(word);
                saveProgress();
                alert('✅ 已标记为已学会！');
            }
        }

        // ==================== 收藏 ====================
        function renderCollections() {
            const collections = progress.collections ? Object.values(progress.collections) : [];
            let html = '';
            if (collections.length === 0) {
                html = '<p style="text-align:center;color:#95a5a6;padding:30px;">暂无收藏单词</p>';
            } else {
                collections.forEach(item => {
                    html += `<div class="list-item">${item.word}<span style="color:#7f8c8d;">${item.meaning}</span></div>`;
                });
            }
            document.getElementById('collection-list').innerHTML = html;
        }

        function reviewCollections() {
            const collections = progress.collections ? Object.values(progress.collections) : [];
            if (collections.length === 0) { alert('暂无收藏单词'); return; }

            reviewQuestions = collections.map(c => {
                const correct = c.meaning;
                const others = vocabulary
                    .filter(w => w.meaning !== correct)
                    .map(w => w.meaning);
                const options = [correct];
                for (let i = 0; i < 3 && others.length > 0; i++) {
                    const idx = Math.floor(Math.random() * others.length);
                    options.push(others.splice(idx, 1)[0]);
                }
                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }
                return { word: c.word, options, correct };
            });

            reviewIndex = 0;
            reviewScore = 0;
            switchTab('review', document.querySelectorAll('.tab')[3]);
            showReviewQuestion();
        }

        function clearCollections() {
            if (confirm('确定清空所有收藏？')) {
                progress.collections = {};
                saveProgress();
                renderCollections();
            }
        }

        // ==================== 测试模式 ====================
        function startTest() {
            if (vocabulary.length < 4) { alert('单词不足（至少4个）'); return; }

            const sample = [...vocabulary].sort(() => Math.random() - 0.5).slice(0, Math.min(10, vocabulary.length));
            testQuestions = sample.map(w => {
                const correct = w.meaning;
                const others = vocabulary
                    .filter(v => v.meaning !== correct)
                    .map(v => v.meaning);
                const options = [correct];
                for (let i = 0; i < 3; i++) {
                    const idx = Math.floor(Math.random() * others.length);
                    options.push(others.splice(idx, 1)[0]);
                }
                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }
                return { word: w.word, options, correct };
            });

            testIndex = 0;
            testScore = 0;
            testWrongWords = [];
            showTestQuestion();
        }

        function showTestQuestion() {
            if (testIndex >= testQuestions.length) { showTestResult(); return; }

            const q = testQuestions[testIndex];
            let html = `<p style="font-size:22px;margin-bottom:15px;"><b>${q.word}</b> 的意思是？</p>`;
            html += `<p class="progress-text">${testIndex + 1} / ${testQuestions.length}</p>`;

            q.options.forEach((opt, i) => {
                html += `<button class="option-btn" onclick="checkTestAnswer(${i}, '${opt.replace(/'/g, "\\'")}')">${String.fromCharCode(65+i)}. ${opt}</button>`;
            });

            document.getElementById('test-content').innerHTML = html;
        }

        function checkTestAnswer(idx, selected) {
            const q = testQuestions[testIndex];

            if (selected === q.correct) {
                testScore++;
            } else {
                testWrongWords.push(q.word);
            }

            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent.includes(q.correct)) btn.classList.add('correct');
                if (btn.textContent.includes(selected) && selected !== q.correct) btn.classList.add('wrong');
            });

            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.marginTop = '15px';
            div.innerHTML = '<button class="btn btn-blue" onclick="nextTestQuestion()">继续 ➡</button>';
            document.getElementById('test-content').appendChild(div);
        }

        function nextTestQuestion() { testIndex++; showTestQuestion(); }

        function showTestResult() {
            const pct = testQuestions.length > 0 ? (testScore / testQuestions.length * 100) : 0;
            const comment = pct >= 90 ? '🌟 太棒了！' : pct >= 70 ? '💪 不错！' : pct >= 50 ? '📚 加油！' : '📖 继续努力！';

            let html = `<p class="result-big" style="color:#27ae60;">${testScore}/${testQuestions.length}</p>`;
            html += `<p style="font-size:18px;">正确率 ${pct.toFixed(1)}%</p>`;
            html += `<p style="font-size:20px;">${comment}</p>`;
            html += '<button class="btn btn-blue" onclick="startTest()" style="margin-top:15px;">再来一次</button>';

            document.getElementById('test-content').innerHTML = html;

            progress.correct_count += testScore;
            progress.wrong_count += (testQuestions.length - testScore);
            testWrongWords.forEach(w => {
                if (!progress.wrong_words.includes(w)) progress.wrong_words.push(w);
            });
            progress.test_history = progress.test_history || [];
            progress.test_history.push({
                date: new Date().toISOString().slice(0, 16).replace('T', ' '),
                score: testScore,
                total: testQuestions.length
            });
            saveProgress();
        }

        // ==================== 复习模式 ====================
        function startReview() {
            const wrongWords = progress.wrong_words || [];
            if (wrongWords.length === 0) { alert('暂无错词！'); return; }

            const reviewList = vocabulary.filter(w => wrongWords.includes(w.word));
            reviewQuestions = reviewList.map(w => {
                const correct = w.meaning;
                const others = vocabulary
                    .filter(v => v.meaning !== correct)
                    .map(v => v.meaning);
                const options = [correct];
                for (let i = 0; i < 3 && others.length > 0; i++) {
                    const idx = Math.floor(Math.random() * others.length);
                    options.push(others.splice(idx, 1)[0]);
                }
                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }
                return { word: w.word, options, correct };
            });

            reviewIndex = 0;
            reviewScore = 0;
            showReviewQuestion();
        }

        function showReviewQuestion() {
            if (reviewIndex >= reviewQuestions.length) { showReviewResult(); return; }

            const q = reviewQuestions[reviewIndex];
            let html = `<p style="font-size:22px;margin-bottom:15px;">🔄 <b>${q.word}</b></p>`;
            html += `<p class="progress-text">${reviewIndex + 1} / ${reviewQuestions.length}</p>`;

            q.options.forEach((opt, i) => {
                html += `<button class="option-btn" onclick="checkReviewAnswer(${i}, '${opt.replace(/'/g, "\\'")}')">${String.fromCharCode(65+i)}. ${opt}</button>`;
            });

            document.getElementById('review-content').innerHTML = html;
        }

        function checkReviewAnswer(idx, selected) {
            const q = reviewQuestions[reviewIndex];

            if (selected === q.correct) {
                reviewScore++;
                progress.wrong_words = progress.wrong_words.filter(w => w !== q.word);
                saveProgress();
            }

            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent.includes(q.correct)) btn.classList.add('correct');
                if (btn.textContent.includes(selected) && selected !== q.correct) btn.classList.add('wrong');
            });

            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.marginTop = '15px';
            div.innerHTML = '<button class="btn btn-blue" onclick="nextReviewQuestion()">继续 ➡</button>';
            document.getElementById('review-content').appendChild(div);
        }

        function nextReviewQuestion() { reviewIndex++; showReviewQuestion(); }

        function showReviewResult() {
            const pct = reviewQuestions.length > 0 ? (reviewScore / reviewQuestions.length * 100) : 0;
            let html = `<p class="result-big" style="color:#27ae60;">${reviewScore}/${reviewQuestions.length}</p>`;
            html += `<p style="font-size:18px;">正确率 ${pct.toFixed(1)}%</p>`;
            html += '<button class="btn btn-blue" onclick="startReview()" style="margin-top:15px;">再来一次</button>';
            document.getElementById('review-content').innerHTML = html;
        }

        // ==================== 统计 ====================
        function renderStats() {
            const studied = progress.studied_words.length;
            const correct = progress.correct_count;
            const wrong = progress.wrong_count;
            const totalAns = correct + wrong;
            const pct = totalAns > 0 ? (correct / totalAns * 100).toFixed(1) : 0;
            const collected = progress.collections ? Object.keys(progress.collections).length : 0;
            const wrongCount = (progress.wrong_words || []).length;

            document.getElementById('stats-grid').innerHTML = `
                <div class="stat-card"><div class="stat-num" style="color:#3498db;">${studied}</div>已学单词</div>
                <div class="stat-card"><div class="stat-num" style="color:#f39c12;">${collected}</div>收藏单词</div>
                <div class="stat-card"><div class="stat-num" style="color:#2ecc71;">${pct}%</div>正确率</div>
                <div class="stat-card"><div class="stat-num" style="color:#e74c3c;">${wrongCount}</div>待复习错词</div>
            `;

            drawPieChart(correct, wrong);
        }

        function drawPieChart(correct, wrong) {
            const canvas = document.getElementById('pie-chart');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const total = correct + wrong;
            if (total === 0) {
                ctx.fillStyle = '#95a5a6';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂无答题数据', canvas.width/2, canvas.height/2);
                return;
            }

            const cx = canvas.width / 2 - 40;
            const cy = canvas.height / 2;
            const r = Math.min(cx - 20, cy - 20);

            const correctAngle = (correct / total) * Math.PI * 2;

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + correctAngle);
            ctx.fillStyle = '#3498db';
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, -Math.PI / 2 + correctAngle, Math.PI * 1.5);
            ctx.fillStyle = '#e74c3c';
            ctx.fill();

            const lx = cx + r + 30;
            ctx.fillStyle = '#3498db';
            ctx.fillRect(lx, cy - 25, 15, 15);
            ctx.fillStyle = '#333';
            ctx.font = '13px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('正确 ' + correct, lx + 20, cy - 12);

            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(lx, cy, 15, 15);
            ctx.fillStyle = '#333';
            ctx.fillText('错误 ' + wrong, lx + 20, cy + 13);
        }

        // ==================== 初始化 ====================
        loadVocabulary();
    </script>
