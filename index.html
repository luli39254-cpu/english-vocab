<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>📚 英语背单词</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
        .header { background: linear-gradient(135deg, #2c3e50, #3498db); color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .tab-bar { display: flex; background: white; position: sticky; top: 52px; z-index: 99; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow-x: auto; }
        .tab { flex: 1; padding: 12px 4px; text-align: center; cursor: pointer; font-size: 12px; border: none; background: white; color: #7f8c8d; white-space: nowrap; transition: all 0.3s; }
        .tab.active { color: #3498db; border-bottom: 3px solid #3498db; font-weight: bold; }
        .container { max-width: 500px; margin: 0 auto; padding: 15px; padding-bottom: 80px; }
        .card { background: white; border-radius: 16px; padding: 25px 20px; margin: 12px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center; }
        .word-display { font-size: 38px; font-weight: bold; color: #2c3e50; margin: 10px 0; }
        .meaning-display { font-size: 20px; color: #27ae60; margin: 8px 0; }
        .example-display { font-size: 14px; color: #7f8c8d; font-style: italic; margin: 8px 0; }
        .btn { padding: 10px 16px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; margin: 4px; color: white; transition: all 0.2s; display: inline-block; }
        .btn:active { transform: scale(0.95); }
        .btn-blue { background: #3498db; }
        .btn-green { background: #2ecc71; }
        .btn-orange { background: #f39c12; }
        .btn-red { background: #e74c3c; }
        .btn-gray { background: #95a5a6; }
        .btn-purple { background: #9b59b6; }
        .btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 15px; }
        .option-btn { display: block; width: 100%; padding: 14px; margin: 6px 0; border: 2px solid #e0e0e0; border-radius: 12px; background: white; font-size: 16px; cursor: pointer; text-align: left; }
        .option-btn.correct { background: #2ecc71; color: white; border-color: #2ecc71; }
        .option-btn.wrong { background: #e74c3c; color: white; border-color: #e74c3c; }
        .option-btn:disabled { pointer-events: none; opacity: 0.8; }
        .progress-text { font-size: 12px; color: #95a5a6; margin: 8px 0; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; }
        .badge-star { background: #fff3cd; color: #f39c12; }
        .list-item { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none !important; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="header">📚 英语背单词</div>
    <div class="tab-bar">
        <button class="tab active" onclick="switchTab('study', this)">📖 学习</button>
        <button class="tab" onclick="switchTab('add', this)">➕ 添加</button>
        <button class="tab" onclick="switchTab('mywords', this)">📋 我的词库</button>
        <button class="tab" onclick="switchTab('test', this)">✍️ 测试</button>
        <button class="tab" onclick="switchTab('review', this)">🔄 复习</button>
        <button class="tab" onclick="switchTab('stats', this)">📊 统计</button>
    </div>
    <div class="container">
        <!-- 学习面板 -->
        <div id="study-panel">
            <div class="card">
                <div id="collect-badge"></div>
                <div class="word-display" id="study-word">--</div>
                <div class="meaning-display" id="study-meaning"></div>
                <div class="example-display" id="study-example"></div>
                <div class="progress-text" id="study-progress"></div>
                <div class="btn-row">
                    <button class="btn btn-blue" onclick="prevWord()">⬅</button>
                    <button class="btn btn-orange" id="collect-btn" onclick="toggleCollect()">⭐</button>
                    <button class="btn btn-green" onclick="markLearned()">✔</button>
                    <button class="btn btn-blue" onclick="nextWord()">➡</button>
                </div>
            </div>
        </div>
        <!-- 添加单词面板 -->
        <div id="add-panel" class="hidden">
            <div class="card">
                <h3>➕ 添加新单词</h3>
                <input type="text" id="new-word" placeholder="单词 (如: hello)">
                <input type="text" id="new-meaning" placeholder="中文释义 (如: 你好)">
                <textarea id="new-example" rows="2" placeholder="例句 (可选)"></textarea>
                <button class="btn btn-green" onclick="addWord()">保存单词</button>
                <p style="color:#95a5a6;margin-top:10px;">单词将保存在本地，可与内置词库一起学习</p>
            </div>
        </div>
        <!-- 我的词库面板 -->
        <div id="mywords-panel" class="hidden">
            <div class="card">
                <h3>📋 我的词库</h3>
                <div id="user-words-list"></div>
                <button class="btn btn-red" onclick="clearUserWords()" style="margin-top:10px;">清空我的词库</button>
            </div>
        </div>
        <!-- 测试/复习/统计面板与之前相同，此处省略精简以节省空间，但保留了基础结构 -->
        <div id="test-panel" class="hidden"><div class="card"><h3>✍️ 单词测试</h3><div id="test-content"><button class="btn btn-blue" onclick="startTest()">开始测试</button></div></div></div>
        <div id="review-panel" class="hidden"><div class="card"><h3>🔄 复习错词</h3><div id="review-content"><button class="btn btn-blue" onclick="startReview()">开始复习</button></div></div></div>
        <div id="stats-panel" class="hidden"><div class="card"><h3>📊 学习统计</h3><div class="stats-grid" id="stats-grid"></div><canvas id="pie-chart" width="280" height="200"></canvas></div></div>
    </div>

    <script>
        // ==================== 内置核心词库（50个，可自行替换更多） ====================
        const BUILT_IN = [
            {"word":"abandon","meaning":"放弃","example":"He abandoned his plan."},
            {"word":"ability","meaning":"能力","example":"She has great ability."},
            // ... 这里可以放置你原有的所有单词，为节省空间仅列数个，实际请粘贴完整词库
            {"word":"zone","meaning":"区域","example":"Time zone."}
        ];

        // ==================== 全局数据 ====================
        let vocabulary = [];
        let progress = {
            studied_words: [],
            correct_count: 0,
            wrong_count: 0,
            test_history: [],
            wrong_words: [],
            collections: {}
        };
        let currentIndex = 0;
        let testQuestions = [], testIndex = 0, testScore = 0, testWrongWords = [];
        let reviewQuestions = [], reviewIndex = 0, reviewScore = 0;

        // 加载用户自定义词库（从localStorage）
        function loadUserWords() {
            const stored = localStorage.getItem('user_vocabulary');
            return stored ? JSON.parse(stored) : [];
        }

        // 保存用户自定义词库
        function saveUserWords(words) {
            localStorage.setItem('user_vocabulary', JSON.stringify(words));
        }

        // 合并内置词库与用户词库，并打乱
        function mergeAndShuffle() {
            const userWords = loadUserWords();
            const all = BUILT_IN.concat(userWords);
            for (let i = all.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [all[i], all[j]] = [all[j], all[i]];
            }
            return all;
        }

        // 初始化词库
        function loadVocabulary() {
            vocabulary = mergeAndShuffle();
            loadStudyWord(0);
            // 加载进度
            const saved = localStorage.getItem('vocab_progress');
            if (saved) { try { progress = JSON.parse(saved); } catch(e) {} }
        }

        function saveProgress() {
            localStorage.setItem('vocab_progress', JSON.stringify(progress));
        }

        // 切换选项卡
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            ['study','add','mywords','test','review','stats'].forEach(id => document.getElementById(id+'-panel').classList.add('hidden'));
            document.getElementById(tab+'-panel').classList.remove('hidden');
            if (tab === 'mywords') renderUserWords();
            if (tab === 'stats') renderStats();
        }

        // ==================== 学习功能（与之前相同） ====================
        function loadStudyWord(index) {
            if (vocabulary.length === 0) { document.getElementById('study-word').textContent = '无单词'; return; }
            currentIndex = ((index % vocabulary.length) + vocabulary.length) % vocabulary.length;
            const word = vocabulary[currentIndex];
            document.getElementById('study-word').textContent = word.word;
            document.getElementById('study-meaning').textContent = word.meaning;
            document.getElementById('study-example').textContent = '📝 ' + (word.example || '暂无例句');
            document.getElementById('study-progress').textContent = `${currentIndex+1} / ${vocabulary.length}`;
            const isCollected = progress.collections && progress.collections[word.word];
            document.getElementById('collect-badge').innerHTML = isCollected ? '<span class="badge badge-star">⭐ 已收藏</span>' : '';
            document.getElementById('collect-btn').textContent = isCollected ? '★' : '☆';
        }

        function nextWord() { loadStudyWord(currentIndex + 1); }
        function prevWord() { loadStudyWord(currentIndex - 1); }

        function toggleCollect() {
            if (vocabulary.length === 0) return;
            const word = vocabulary[currentIndex];
            if (!progress.collections) progress.collections = {};
            if (progress.collections[word.word]) {
                delete progress.collections[word.word];
            } else {
                progress.collections[word.word] = { word: word.word, meaning: word.meaning, example: word.example || '', date: new Date().toISOString().slice(0,10) };
            }
            saveProgress();
            loadStudyWord(currentIndex);
        }

        function markLearned() {
            if (vocabulary.length === 0) return;
            const word = vocabulary[currentIndex].word;
            if (!progress.studied_words.includes(word)) {
                progress.studied_words.push(word);
                saveProgress();
                alert('✅ 已标记为已学会！');
            }
        }

        // ==================== 添加单词功能 ====================
        function addWord() {
            const word = document.getElementById('new-word').value.trim();
            const meaning = document.getElementById('new-meaning').value.trim();
            const example = document.getElementById('new-example').value.trim();
            if (!word || !meaning) { alert('单词和释义不能为空'); return; }
            const userWords = loadUserWords();
            // 检查是否已存在
            if (userWords.some(w => w.word === word)) {
                alert('该单词已存在于你的词库中');
                return;
            }
            userWords.push({ word, meaning, example: example || '暂无例句' });
            saveUserWords(userWords);
            // 重新加载词库
            vocabulary = mergeAndShuffle();
            loadStudyWord(0);
            // 清空输入
            document.getElementById('new-word').value = '';
            document.getElementById('new-meaning').value = '';
            document.getElementById('new-example').value = '';
            alert(`✅ 已添加 "${word}" 到词库`);
        }

        // ==================== 我的词库管理 ====================
        function renderUserWords() {
            const userWords = loadUserWords();
            const listDiv = document.getElementById('user-words-list');
            if (userWords.length === 0) {
                listDiv.innerHTML = '<p style="color:#95a5a6;text-align:center;padding:20px;">你还没有添加任何单词</p>';
                return;
            }
            let html = '';
            userWords.forEach((w, index) => {
                html += `<div class="list-item">
                    <span><b>${w.word}</b> - ${w.meaning}</span>
                    <button class="btn btn-red" style="padding:6px 12px;font-size:12px;" onclick="deleteUserWord(${index})">删除</button>
                </div>`;
            });
            listDiv.innerHTML = html;
        }

        function deleteUserWord(index) {
            const userWords = loadUserWords();
            userWords.splice(index, 1);
            saveUserWords(userWords);
            vocabulary = mergeAndShuffle();
            loadStudyWord(0);
            renderUserWords();
        }

        function clearUserWords() {
            if (confirm('确定清空所有自定义单词吗？内置词库不会受影响。')) {
                localStorage.removeItem('user_vocabulary');
                vocabulary = mergeAndShuffle();
                loadStudyWord(0);
                renderUserWords();
            }
        }

        // ==================== 测试/复习/统计（与之前一致，此处省略细节） ====================
        // ... 请将之前完整版中的 startTest, checkTestAnswer, showTestResult, startReview, 等函数复制到这里 ...
        // 为节省篇幅，这里不再重复，但实际使用时必须保留它们。

        // 启动
        loadVocabulary();
    </script>
</body>
</html>
